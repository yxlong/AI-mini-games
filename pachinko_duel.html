<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双人弹珠迷宫对决</title>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<style>
    /* ============================================================
       双人弹珠迷宫对决 - 儿童手绘涂鸦风格
       ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
        background: #fdf8f0;
        /* 浅黄纸张纹理 */
        background-image:
            repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.01) 2px, rgba(0,0,0,0.01) 4px),
            repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.01) 2px, rgba(0,0,0,0.01) 4px);
        font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
    }

    /* --- 主容器 --- */
    .game-container {
        display: flex;
        width: 100%;
        max-width: 1100px;
        height: 95vh;
        max-height: 780px;
        border: 5px solid #2a1a0a;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 8px 8px 0 #2a1a0a, 12px 12px 24px rgba(0,0,0,0.2);
        background: #fffef7;
    }

    /* --- 左侧迷宫区 (60%) --- */
    .maze-section {
        flex: 0 0 60%;
        position: relative;
        background: #fffef7;
        border-right: 4px solid #2a1a0a;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .maze-section canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: default;
    }

    /* --- 右侧控制面板 (40%) --- */
    .panel-section {
        flex: 0 0 40%;
        display: flex;
        flex-direction: column;
        padding: 20px 24px;
        background: #fffef7;
        overflow-y: auto;
    }

    /* 面板标题 */
    .panel-title {
        font-family: 'Ma Shan Zheng', 'PingFang SC', cursive;
        font-size: 28px;
        color: #2a1a0a;
        text-align: center;
        margin-bottom: 4px;
        line-height: 1.1;
    }

    .panel-divider {
        height: 3px;
        background: repeating-linear-gradient(90deg, #2a1a0a 0, #2a1a0a 8px, transparent 8px, transparent 14px);
        margin: 8px 0 14px;
        border-radius: 2px;
    }

    /* 玩家信息卡片 */
    .player-card {
        border: 3px solid #2a1a0a;
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 12px;
        background: #fff;
        transition: all 0.3s;
        position: relative;
    }

    .player-card.active-player {
        box-shadow: 4px 4px 0 #2a1a0a;
        transform: translate(-2px, -2px);
        animation: pulse-border 1s ease-in-out infinite;
    }

    @keyframes pulse-border {
        0%,100% { border-color: #2a1a0a; }
        50% { border-color: #f59e0b; }
    }

    .player-card.player-a { border-color: #3b82f6; }
    .player-card.player-b { border-color: #ef4444; }
    .player-card.player-a.active-player { box-shadow: 4px 4px 0 #3b82f6; }
    .player-card.player-b.active-player { box-shadow: 4px 4px 0 #ef4444; }

    .player-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
    }

    .player-icon {
        width: 36px; height: 36px;
        border-radius: 50%;
        border: 3px solid #2a1a0a;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px;
    }
    .player-a .player-icon { background: #dbeafe; color: #3b82f6; }
    .player-b .player-icon { background: #fee2e2; color: #ef4444; }

    .player-name {
        font-weight: 900;
        font-size: 16px;
        color: #2a1a0a;
    }

    .player-score {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 36px;
        font-weight: 900;
        text-align: right;
        color: #2a1a0a;
        line-height: 1;
    }

    /* 弹珠余量 */
    .marbles-remaining {
        display: flex;
        gap: 6px;
        margin-top: 4px;
    }
    .marble-dot {
        width: 20px; height: 20px;
        border-radius: 50%;
        border: 3px solid #2a1a0a;
    }
    .marble-dot.used { opacity: 0.2; }
    .marble-dot.blue { background: #3b82f6; }
    .marble-dot.red { background: #ef4444; }

    /* 钟摆方向提示（面板内） */
    .pendulum-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 12px;
        margin-bottom: 10px;
        background: #fef3c7;
        border: 2px solid #2a1a0a;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        color: #2a1a0a;
    }
    .pendulum-arrow {
        display: inline-block;
        font-size: 20px;
        transition: transform 0.1s;
        width: 24px;
        text-align: center;
    }

    /* 回合状态 */
    .round-info {
        text-align: center;
        padding: 8px 12px;
        background: #fef3c7;
        border: 2px dashed #f59e0b;
        border-radius: 10px;
        margin-bottom: 14px;
        font-weight: 700;
        font-size: 14px;
        color: #92400e;
    }

    /* 发射按钮 */
    .launch-btn {
        display: block;
        width: 100%;
        padding: 16px;
        font-family: 'Ma Shan Zheng', 'PingFang SC', cursive;
        font-size: 28px;
        font-weight: 900;
        color: #fff;
        background: #f59e0b;
        border: 4px solid #2a1a0a;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.15s;
        box-shadow: 4px 4px 0 #2a1a0a;
        letter-spacing: 2px;
        margin-bottom: 12px;
    }

    .launch-btn:hover {
        background: #fbbf24;
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 #2a1a0a;
    }

    .launch-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #2a1a0a;
    }

    .launch-btn:disabled {
        background: #d1d5db;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
        color: #9ca3af;
    }

    /* 新游戏 / 音效按钮 */
    .secondary-btn {
        display: block;
        width: 100%;
        padding: 10px;
        font-size: 14px;
        font-weight: 700;
        color: #2a1a0a;
        background: #fff;
        border: 3px solid #2a1a0a;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.15s;
        margin-bottom: 8px;
    }
    .secondary-btn:hover { background: #fef3c7; }

    .sound-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 12px;
        color: #6b5a4a;
        cursor: pointer;
        padding: 6px;
    }

    /* 游戏结束弹窗 */
    .game-over-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
    }
    .game-over-overlay.show { display: flex; }

    .game-over-card {
        background: #fffef7;
        border: 5px solid #2a1a0a;
        border-radius: 20px;
        padding: 32px 40px;
        text-align: center;
        box-shadow: 8px 8px 0 #2a1a0a;
    }

    .game-over-card h2 {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 36px;
        margin-bottom: 12px;
    }
    .game-over-card .winner-text { font-size: 22px; margin-bottom: 8px; color: #f59e0b; }
    .game-over-card .final-scores { font-size: 16px; color: #6b5a4a; margin-bottom: 20px; }

    .game-over-card button {
        padding: 12px 32px;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 22px;
        font-weight: 900;
        color: #fff;
        background: #10b981;
        border: 4px solid #2a1a0a;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 4px 4px 0 #2a1a0a;
    }
    .game-over-card button:hover { background: #34d399; }

    /* 响应式 */
    @media (max-width: 800px) {
        .game-container { flex-direction: column; height: auto; max-height: none; }
        .maze-section { flex: 0 0 auto; height: 500px; border-right: none; border-bottom: 4px solid #2a1a0a; }
        .panel-section { flex: 0 0 auto; }
    }
</style>
</head>
<body>

<div class="game-container">

    <!-- ========== 左侧：迷宫区 ========== -->
    <div class="maze-section" id="mazeSection">
        <canvas id="mazeCanvas"></canvas>
    </div>

    <!-- ========== 右侧：控制面板 ========== -->
    <div class="panel-section">
        <div class="panel-title">🎱 弹珠迷宫对决</div>
        <div class="panel-divider"></div>

        <!-- 玩家 A -->
        <div class="player-card player-a active-player" id="cardA">
            <div class="player-header">
                <div class="player-icon">○</div>
                <div class="player-name">玩家 A</div>
                <div class="player-score" id="scoreA">0</div>
            </div>
            <div class="marbles-remaining" id="marblesA"></div>
        </div>

        <!-- 玩家 B -->
        <div class="player-card player-b" id="cardB">
            <div class="player-header">
                <div class="player-icon">👤</div>
                <div class="player-name">玩家 B</div>
                <div class="player-score" id="scoreB">0</div>
            </div>
            <div class="marbles-remaining" id="marblesB"></div>
        </div>

        <!-- 回合信息 -->
        <div class="round-info" id="roundInfo">第 1 轮 · 玩家 A 的回合</div>

        <!-- 钟摆方向提示（从 Canvas 移出到面板） -->
        <div class="pendulum-hint" id="pendulumHint">
            <span class="pendulum-arrow" id="pendulumArrow">↓</span>
            <span>看准钟摆方向，点击发射！</span>
        </div>

        <!-- 发射按钮 -->
        <button class="launch-btn" id="launchBtn">🚀 发射 !</button>

        <!-- 辅助按钮 -->
        <button class="secondary-btn" id="newGameBtn">🔄 新游戏</button>
        <div class="sound-toggle" id="soundToggle">🔊 音效开启</div>
    </div>
</div>

<!-- 游戏结束弹窗 -->
<div class="game-over-overlay" id="gameOverOverlay">
    <div class="game-over-card">
        <h2>🎉 游戏结束！</h2>
        <div class="winner-text" id="winnerText"></div>
        <div class="final-scores" id="finalScores"></div>
        <button id="playAgainBtn">🔄 再来一局</button>
    </div>
</div>

<script>
(function() {
    /* ================================================================
     *  双人弹珠迷宫对决 - 核心游戏逻辑
     *  使用 Matter.js 物理引擎 + Web Audio API 音效 + Canvas 手绘渲染
     * ================================================================ */

    // ---------- DOM 引用 ----------
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const mazeSection = document.getElementById('mazeSection');
    const launchBtn = document.getElementById('launchBtn');
    const newGameBtn = document.getElementById('newGameBtn');
    const soundToggle = document.getElementById('soundToggle');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const winnerText = document.getElementById('winnerText');
    const finalScores = document.getElementById('finalScores');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const cardA = document.getElementById('cardA');
    const cardB = document.getElementById('cardB');
    const scoreA = document.getElementById('scoreA');
    const scoreB = document.getElementById('scoreB');
    const marblesA = document.getElementById('marblesA');
    const marblesB = document.getElementById('marblesB');
    const roundInfo = document.getElementById('roundInfo');

    /* ================================================================
     *  画布设置
     * ================================================================ */
    const WORLD_W = 500;   // Matter.js 世界宽度
    const WORLD_H = 700;   // Matter.js 世界高度
    canvas.width = WORLD_W;
    canvas.height = WORLD_H;

    // roundRect 兼容补丁
    if (!ctx.roundRect) {
        ctx.roundRect = function(x, y, w, h, r) {
            if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
            ctx.beginPath();
            ctx.moveTo(x + r.tl, y);
            ctx.lineTo(x + w - r.tr, y);
            ctx.arcTo(x + w, y, x + w, y + r.tr, r.tr);
            ctx.lineTo(x + w, y + h - r.br);
            ctx.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
            ctx.lineTo(x + r.bl, y + h);
            ctx.arcTo(x, y + h, x, y + h - r.bl, r.bl);
            ctx.lineTo(x, y + r.tl);
            ctx.arcTo(x, y, x + r.tl, y, r.tl);
            ctx.closePath();
        };
    }

    /* ================================================================
     *  音效引擎 (Web Audio API 合成)
     * ================================================================ */
    let audioCtx = null;
    let soundEnabled = true;

    function ensureAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    /** 弹珠碰撞墙壁 —— 清脆"咔哒"声 */
    function playClack() {
        if (!soundEnabled) return;
        const ac = ensureAudio();
        const t = ac.currentTime;
        // 短促噪声 + 正弦音
        const buf = ac.createBuffer(1, ac.sampleRate * 0.04, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) {
            d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.006));
        }
        const noise = ac.createBufferSource(); noise.buffer = buf;
        const filter = ac.createBiquadFilter();
        filter.type = 'bandpass'; filter.frequency.value = 2800; filter.Q.value = 3;
        const g = ac.createGain(); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        noise.connect(filter); filter.connect(g); g.connect(ac.destination);
        noise.start(t); noise.stop(t + 0.04);
    }

    /** 弹珠滚动声 */
    function playRoll() {
        if (!soundEnabled) return;
        const ac = ensureAudio();
        const t = ac.currentTime;
        const osc = ac.createOscillator();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(120, t);
        const g = ac.createGain(); g.gain.setValueAtTime(0.06, t); g.gain.linearRampToValueAtTime(0, t + 0.25);
        osc.connect(g); g.connect(ac.destination);
        osc.start(t); osc.stop(t + 0.25);
    }

    /** 掉入计分洞 —— "叮!" 金币声 */
    function playCoin() {
        if (!soundEnabled) return;
        const ac = ensureAudio();
        const t = ac.currentTime;
        const osc = ac.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.linearRampToValueAtTime(1320, t + 0.12);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(g); g.connect(ac.destination);
        osc.start(t); osc.stop(t + 0.35);
    }

    /** 5 分特别音效 —— 三连音升调 */
    function playFiveStar() {
        if (!soundEnabled) return;
        const ac = ensureAudio();
        const t = ac.currentTime;
        [523, 659, 784].forEach((freq, i) => {
            const osc = ac.createOscillator(); osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + i * 0.08);
            const g = ac.createGain();
            g.gain.setValueAtTime(0.25, t + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.2);
            osc.connect(g); g.connect(ac.destination);
            osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.2);
        });
    }

    /** UI 点击音 */
    function playClick() {
        if (!soundEnabled) return;
        const ac = ensureAudio();
        const t = ac.currentTime;
        const osc = ac.createOscillator(); osc.type = 'sine';
        osc.frequency.setValueAtTime(600, t);
        const g = ac.createGain(); g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        osc.connect(g); g.connect(ac.destination);
        osc.start(t); osc.stop(t + 0.06);
    }

    soundToggle.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundToggle.textContent = soundEnabled ? '🔊 音效开启' : '🔇 音效关闭';
        if (soundEnabled) ensureAudio();
    });

    /* ================================================================
     *  Matter.js 物理世界初始化
     * ================================================================ */
    const { Engine, Bodies, Body, Events, Composite, Constraint } = Matter;

    const engine = Engine.create({
        gravity: { x: 0, y: 1.8, scale: 0.001 }
    });

    const world = engine.world;

    // 分组管理
    let wallBodies = [];
    let sensorBodies = [];
    let baffleConstraints = [];   // 旋转挡板的约束
    let currentMarble = null;
    const scoredMarbleIds = new Set();

    /* ================================================================
     *  迷宫构建
     * ================================================================ */

    /** 创建可旋转挡板 —— 动态刚体 + 中心销钉约束，弹珠撞击会转动 */
    function createBaffle(cx, cy, width, angleDeg) {
        const angle = angleDeg * Math.PI / 180;
        const h = 9 + Math.random() * 3;
        const body = Bodies.rectangle(cx, cy, width, h, {
            isStatic: false,            // 动态 —— 可被弹珠撞动
            angle: angle,
            density: 0.0012,            // 轻质，容易被弹珠带动
            frictionAir: 0.015,         // 转动后逐渐减速
            label: 'baffle',
            render: { fillStyle: '#e8a020' }
        });
        // 销钉约束：固定在原位，仅允许绕中心旋转
        const pin = Constraint.create({
            pointA: { x: cx, y: cy },
            bodyB: body,
            pointB: { x: 0, y: 0 },
            stiffness: 1,
            length: 0
        });
        return { body, pin };
    }

    /** 创建圆形障碍物（木钉） */
    function createPeg(cx, cy, radius) {
        return Bodies.circle(cx, cy, radius, {
            isStatic: true,
            label: 'peg',
            render: { fillStyle: '#2a1a0a' }
        });
    }

    /** 创建计分传感器 */
    function createSensor(cx, cy, w, h, slotNumber) {
        return Bodies.rectangle(cx, cy, w, h, {
            isStatic: true,
            isSensor: true,
            label: `sensor-${slotNumber}`
        });
    }

    /** 构建整个迷宫 */
    function buildMaze() {
        const allWalls = [];
        const allSensors = [];

        // --- 顶部发射口围栏 ---
        allWalls.push(Bodies.rectangle(250, 8, 120, 10, { isStatic: true, label: 'wall' })); // 顶边
        // 发射口两侧短墙
        allWalls.push(Bodies.rectangle(175, 35, 12, 40, { isStatic: true, label: 'wall' }));
        allWalls.push(Bodies.rectangle(325, 35, 12, 40, { isStatic: true, label: 'wall' }));

        // --- 左右边界（分小段波浪墙，减小振幅留足内部空间） ---
        const boundaryLeft = 20;
        const boundaryRight = 480;
        const segH = 28;
        for (let y = 60; y < 578; y += segH) {
            const t = (y - 60) / 518;
            const wave = 4;
            const lx = boundaryLeft + Math.sin(t * Math.PI * 3.2) * wave + Math.sin(t * 21) * 2;
            const rx = boundaryRight + Math.sin(t * Math.PI * 3.2 + 1.2) * wave + Math.cos(t * 21) * 2;
            allWalls.push(Bodies.rectangle(lx, y + segH/2, 14, segH + 2, { isStatic: true, label: 'wall' }));
            allWalls.push(Bodies.rectangle(rx, y + segH/2, 14, segH + 2, { isStatic: true, label: 'wall' }));
        }

        // --- Plinko 钉板：13 行 × (4~6) 列，奇偶交错，每钉带随机抖动 ---
        const pegRows = 12;
        const pegStartY = 108;   // 下移避开钟摆球最大摆幅 (y≈80)
        const pegEndY = 555;
        const rowSpacing = (pegEndY - pegStartY) / (pegRows - 1);
        for (let row = 0; row < pegRows; row++) {
            const y = pegStartY + row * rowSpacing + (Math.random() - 0.5) * 6;
            const even = (row % 2 === 0);
            const count = even ? 5 : 4;
            const baseX = even ? 72 : 118;
            const colSpacing = even ? 90 : 100;
            for (let col = 0; col < count; col++) {
                const x = baseX + col * colSpacing + (Math.random() - 0.5) * 14;
                allWalls.push(createPeg(x, y, 7 + Math.random() * 3.5));
            }
        }

        // --- 短挡板（50~70px）穿插在钉排之间，制造突变反弹 ---
        // 旋转挡板 —— 仅 5 块，宽度缩减到 50px（旋转半径 25px），
        // 全部放在两排钉正中 + 两列钉正中，距任何碰撞体 ≥ 40px
        const shortBaffles = [
            [168, 128, 50, -35],  // row0-1, odd-column-mid
            [297, 210, 50,  32],  // row2-3, even-column-mid
            [207, 291, 50, -28],  // row4-5, even-column-mid
            [387, 372, 50,  30],  // row6-7, even-column-mid
            [268, 453, 50, -25],  // row8-9, odd-column-mid
        ];
        shortBaffles.forEach(([cx, cy, w, a]) => {
            const { body, pin } = createBaffle(cx, cy, w, a);
            allWalls.push(body);
            baffleConstraints.push(pin);
        });

        // --- 底部计分槽 ---
        const slotTop = 580;
        const slotBot = 688;
        const dividerXs = [112, 204, 296, 388];

        dividerXs.forEach(dx => {
            allWalls.push(Bodies.rectangle(dx, (slotTop + slotBot) / 2, 7, slotBot - slotTop, {
                isStatic: true, label: 'wall'
            }));
        });

        // 底部横墙
        allWalls.push(Bodies.rectangle(250, slotBot, WORLD_W - 36, 14, {
            isStatic: true, label: 'wall'
        }));

        // 槽入口小斜面
        dividerXs.forEach(dx => {
            allWalls.push(Bodies.rectangle(dx - 6, slotTop + 5, 6, 16, {
                isStatic: true, label: 'wall', angle: -0.35
            }));
            allWalls.push(Bodies.rectangle(dx + 6, slotTop + 5, 6, 16, {
                isStatic: true, label: 'wall', angle: 0.35
            }));
        });

        // --- 计分传感器 ---
        const slotCenters = [66, 158, 250, 342, 434];
        slotCenters.forEach((cx, i) => {
            const sensor = createSensor(cx, slotTop + 14, 82, 14, i + 1);
            allSensors.push(sensor);
        });

        // 写入世界
        allWalls.forEach(w => Composite.add(world, w));
        wallBodies = allWalls;
        allSensors.forEach(s => Composite.add(world, s));
        sensorBodies = allSensors;
        baffleConstraints.forEach(c => Composite.add(world, c));
    }

    /** 清除迷宫（用于重置） */
    function clearMaze() {
        [...wallBodies, ...sensorBodies].forEach(b => Composite.remove(world, b));
        baffleConstraints.forEach(c => Composite.remove(world, c));
        wallBodies = [];
        sensorBodies = [];
        baffleConstraints = [];
        if (currentMarble) {
            Composite.remove(world, currentMarble);
            currentMarble = null;
        }
        scoredMarbleIds.clear();
    }

    /** 重建迷宫 */
    function rebuildMaze() {
        clearMaze();
        buildMaze();
    }

    /* ================================================================
     *  游戏状态
     * ================================================================ */

    const PLAYER_A = 'A';
    const PLAYER_B = 'B';
    const MARBLES_PER_PLAYER = 4;

    let playerScores = { A: 0, B: 0 };
    let marblesRemaining = { A: MARBLES_PER_PLAYER, B: MARBLES_PER_PLAYER };
    let currentPlayer = PLAYER_A;
    let totalLaunches = 0;          // 已发射次数 (0-7)
    let gameActive = false;        // 游戏是否进行中
    let marbleInPlay = false;      // 当前是否有弹珠在飞行
    let currentScoredSlot = null;  // 本次得分槽号
    let marbleTimeoutId = null;    // 超时计时器

    /* ================================================================
     *  特效系统
     * ================================================================ */

    // 粒子
    let particles = [];
    // 金色闪光
    let goldFlash = 0;
    // 得分弹出文字
    let scorePopup = null;
    // 弹珠拖尾（运动模糊）
    let marbleTrail = [];
    // 上次碰撞时间（用于滚动音效节流）
    let lastCollisionTime = 0;

    /** 生成粒子爆发 */
    function spawnParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 6;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 3,
                life: 30 + Math.random() * 20,
                maxLife: 50,
                size: 3 + Math.random() * 6,
                color: color
            });
        }
    }

    function updateParticles() {
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15;
            p.life--;
        });
        particles = particles.filter(p => p.life > 0);
    }

    function updateEffects() {
        if (goldFlash > 0) goldFlash -= 0.06;
        if (scorePopup) {
            scorePopup.y -= 1.5;
            scorePopup.alpha -= 0.02;
            if (scorePopup.alpha <= 0) scorePopup = null;
        }
        // 更新拖尾
        marbleTrail.forEach(t => t.alpha -= 0.06);
        marbleTrail = marbleTrail.filter(t => t.alpha > 0);
    }

    /* ================================================================
     *  发射弹珠
     * ================================================================ */

    function launchMarble() {
        if (!gameActive || marbleInPlay) return;
        if (marblesRemaining[currentPlayer] <= 0) return;

        playClick();

        // 读取钟摆角度决定弹珠出生位置和水平初速
        const pendAngle = window.__pendAngle || 0;
        const spawnOffset = Math.sin(pendAngle) * 45;       // 水平偏移
        const spawnX = 250 + spawnOffset;
        const spawnY = 45;
        const radius = 9;
        // 水平初速随摆角变化：摆动越快，初速越大
        const launchVX = Math.sin(pendAngle) * 5.5;

        const marble = Bodies.circle(spawnX, spawnY, radius, {
            restitution: 0.62,
            friction: 0.04,
            frictionAir: 0.001,
            density: 0.002,
            label: 'marble',
            render: { fillStyle: currentPlayer === PLAYER_A ? '#3b82f6' : '#ef4444' }
        });

        Body.setVelocity(marble, { x: launchVX, y: 0.6 });

        Composite.add(world, marble);
        currentMarble = marble;
        marbleInPlay = true;
        currentScoredSlot = null;
        marbleTrail = [];
        lastCollisionTime = 0;

        // 更新 UI
        launchBtn.disabled = true;
        launchBtn.textContent = '⏳ 下落中...';
        updateUI();  // 刷新面板钟摆提示可见性

        // 超时保护：12 秒仍未入槽 → 0 分
        marbleTimeoutId = setTimeout(() => {
            if (marbleInPlay && currentMarble) {
                handleScoring(0, currentMarble);
            }
        }, 12000);
    }

    /* ================================================================
     *  计分处理
     * ================================================================ */

    function handleScoring(slotNumber, marble) {
        if (!marbleInPlay) return;
        if (scoredMarbleIds.has(marble.id)) return;

        scoredMarbleIds.add(marble.id);
        marbleInPlay = false;
        currentScoredSlot = slotNumber;

        // 清除超时
        if (marbleTimeoutId) { clearTimeout(marbleTimeoutId); marbleTimeoutId = null; }

        const isMiss = (slotNumber === 0);

        // 播放音效
        if (isMiss) {
            playClack();              // 卡住→0分，沉闷撞击声
        } else if (slotNumber === 5) {
            playFiveStar();
        } else {
            playCoin();
        }

        // 记录分数（0分不加）
        if (!isMiss) {
            playerScores[currentPlayer] += slotNumber;
        }

        // 特效
        const slotCenters = [66, 158, 250, 342, 434];
        if (!isMiss) {
            const sx = slotCenters[slotNumber - 1];
            const sy = 600;
            if (slotNumber === 5) {
                goldFlash = 1.0;
                spawnParticles(sx, sy, 40, '#fbbf24');
                spawnParticles(sx, sy, 20, '#f59e0b');
            } else if (slotNumber >= 3) {
                spawnParticles(sx, sy, 12, '#fcd34d');
            }
            scorePopup = {
                x: sx, y: sy - 20,
                text: `+${slotNumber}`,
                alpha: 1.0,
                color: slotNumber === 5 ? '#f59e0b' : '#2a1a0a'
            };
        } else {
            // 0分弹出在正中底部
            scorePopup = {
                x: 250, y: 560,
                text: '0 分!',
                alpha: 1.0,
                color: '#999'
            };
        }

        // 延迟 0.5 秒后切换回合
        setTimeout(advanceTurn, 600);
    }

    /** 切换到下一位玩家 */
    function advanceTurn() {
        // 移除当前弹珠
        if (currentMarble) {
            Composite.remove(world, currentMarble);
            currentMarble = null;
        }

        // 扣除弹珠
        marblesRemaining[currentPlayer]--;
        totalLaunches++;

        updateUI();

        // 检查游戏是否结束
        if (totalLaunches >= MARBLES_PER_PLAYER * 2) {
            endGame();
            return;
        }

        // 切换玩家
        currentPlayer = currentPlayer === PLAYER_A ? PLAYER_B : PLAYER_A;
        currentScoredSlot = null;
        marbleInPlay = false;

        launchBtn.disabled = false;
        launchBtn.textContent = '🚀 发射 !';
        updateUI();
    }

    /** 游戏结束 */
    function endGame() {
        gameActive = false;
        marbleInPlay = false;
        launchBtn.disabled = true;
        launchBtn.textContent = '游戏结束';

        const scoreDiff = playerScores.A - playerScores.B;
        let winnerStr;
        if (scoreDiff > 0) {
            winnerStr = '🏆 玩家 A 获胜！';
        } else if (scoreDiff < 0) {
            winnerStr = '🏆 玩家 B 获胜！';
        } else {
            winnerStr = '🤝 平局！';
        }

        winnerText.textContent = winnerStr;
        finalScores.textContent = `玩家 A: ${playerScores.A} 分  |  玩家 B: ${playerScores.B} 分`;
        gameOverOverlay.classList.add('show');
    }

    /* ================================================================
     *  重置游戏
     * ================================================================ */

    function resetGame() {
        playerScores = { A: 0, B: 0 };
        marblesRemaining = { A: MARBLES_PER_PLAYER, B: MARBLES_PER_PLAYER };
        currentPlayer = PLAYER_A;
        totalLaunches = 0;
        gameActive = true;
        marbleInPlay = false;
        currentScoredSlot = null;
        particles = [];
        goldFlash = 0;
        scorePopup = null;
        marbleTrail = [];

        if (currentMarble) {
            Composite.remove(world, currentMarble);
            currentMarble = null;
        }
        scoredMarbleIds.clear();
        if (marbleTimeoutId) { clearTimeout(marbleTimeoutId); marbleTimeoutId = null; }

        rebuildMaze();
        launchBtn.disabled = false;
        launchBtn.textContent = '🚀 发射 !';
        gameOverOverlay.classList.remove('show');
        updateUI();
        playClick();
    }

    /* ================================================================
     *  UI 更新
     * ================================================================ */

    function updateUI() {
        scoreA.textContent = playerScores.A;
        scoreB.textContent = playerScores.B;

        // 弹珠余量
        function renderMarbles(container, remaining, colorClass) {
            container.innerHTML = '';
            for (let i = 0; i < MARBLES_PER_PLAYER; i++) {
                const dot = document.createElement('span');
                dot.className = 'marble-dot ' + colorClass + (i >= remaining ? ' used' : '');
                container.appendChild(dot);
            }
        }
        renderMarbles(marblesA, marblesRemaining.A, 'blue');
        renderMarbles(marblesB, marblesRemaining.B, 'red');

        // 当前玩家高亮
        cardA.classList.toggle('active-player', currentPlayer === PLAYER_A && gameActive);
        cardB.classList.toggle('active-player', currentPlayer === PLAYER_B && gameActive);

        // 回合信息
        const roundNum = Math.floor(totalLaunches / 2) + 1;
        const playerName = currentPlayer === PLAYER_A ? '玩家 A' : '玩家 B';
        roundInfo.textContent = `第 ${Math.min(roundNum, MARBLES_PER_PLAYER)} 轮 · ${playerName} 的回合`;

        // 钟摆提示面板可见性
        const ph = document.getElementById('pendulumHint');
        if (ph) {
            ph.style.opacity = (gameActive && !marbleInPlay && marblesRemaining[currentPlayer] > 0) ? '1' : '0.35';
        }
    }

    /* ================================================================
     *  碰撞事件处理
     * ================================================================ */

    // 每帧给旋转挡板施加角速度阻尼，防止永动
    Events.on(engine, 'beforeUpdate', () => {
        wallBodies.forEach(body => {
            if (body.label === 'baffle') {
                Body.setAngularVelocity(body, body.angularVelocity * 0.96);
            }
        });
    });

    Events.on(engine, 'collisionStart', (event) => {
        if (!marbleInPlay || !currentMarble) return;

        event.pairs.forEach(pair => {
            const { bodyA, bodyB } = pair;

            // 检测弹珠是否碰到传感器（计分槽）
            let sensorBody = null;
            if (bodyA.label && bodyA.label.startsWith('sensor-') && bodyB.label === 'marble') {
                sensorBody = bodyA;
            } else if (bodyB.label && bodyB.label.startsWith('sensor-') && bodyA.label === 'marble') {
                sensorBody = bodyB;
            }

            if (sensorBody) {
                const slotNumber = parseInt(sensorBody.label.split('-')[1]);
                handleScoring(slotNumber, currentMarble);
                return;
            }

            // 检测弹珠是否撞到墙壁或木钉 - 播放碰撞音效
            const otherBody = bodyA.label === 'marble' ? bodyB : (bodyB.label === 'marble' ? bodyA : null);
            if (otherBody && (otherBody.label === 'wall' || otherBody.label === 'peg' || otherBody.label === 'baffle')) {
                const now = performance.now();
                // 节流：避免连续播放太多声音
                if (now - lastCollisionTime > 80) {
                    // 根据碰撞速度调整音量
                    const relVelocity = pair.collision ? pair.collision.depth : 5;
                    if (relVelocity > 3) {
                        playClack();
                    } else {
                        playRoll();
                    }
                    lastCollisionTime = now;
                }
            }
        });
    });

    /* ================================================================
     *  自定义渲染
     * ================================================================ */

    function drawDoodleLine(x1, y1, x2, y2, color, width) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        // 在手绘直线中加入微小抖动
        const segments = Math.max(2, Math.floor(Math.hypot(x2 - x1, y2 - y1) / 20));
        ctx.moveTo(x1, y1);
        for (let i = 1; i <= segments; i++) {
            const t = i / segments;
            const jx = (Math.random() - 0.5) * 2;
            const jy = (Math.random() - 0.5) * 2;
            ctx.lineTo(x1 + (x2 - x1) * t + jx, y1 + (y2 - y1) * t + jy);
        }
        ctx.stroke();
    }

    function drawDoodleRect(cx, cy, w, h, angle) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle || 0);

        // 绘制粗黑边框（手绘抖动）
        ctx.strokeStyle = '#2a1a0a';
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        const hw = w / 2, hh = h / 2;
        const jitter = () => (Math.random() - 0.5) * 3;
        ctx.moveTo(-hw + jitter(), -hh + jitter());
        ctx.lineTo(hw + jitter(), -hh + jitter());
        ctx.lineTo(hw + jitter(), hh + jitter());
        ctx.lineTo(-hw + jitter(), hh + jitter());
        ctx.closePath();
        ctx.stroke();

        // 内部填充
        ctx.fillStyle = '#f5e6d3';
        ctx.fill();

        ctx.restore();
    }

    function render() {
        ctx.clearRect(0, 0, WORLD_W, WORLD_H);

        // --- 纸张纹理背景 ---
        ctx.fillStyle = '#fffef7';
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);

        // 细微纹理线
        ctx.strokeStyle = 'rgba(0,0,0,0.02)';
        ctx.lineWidth = 0.5;
        for (let y = 0; y < WORLD_H; y += 4) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(WORLD_W, y + (Math.random() - 0.5) * 2);
            ctx.stroke();
        }

        /* ---- 绘制标尺边框 ---- */
        ctx.strokeStyle = '#2a1a0a';
        ctx.lineWidth = 5;
        ctx.strokeRect(2, 2, WORLD_W - 4, WORLD_H - 4);

        /* ---- 发射区背景条 ---- */
        ctx.fillStyle = 'rgba(254, 243, 199, 0.5)';
        ctx.fillRect(2, 2, WORLD_W - 4, 68);

        // 分隔线
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(25, 68);
        ctx.lineTo(WORLD_W - 25, 68);
        ctx.stroke();
        ctx.setLineDash([]);

        // 枢轴点
        ctx.fillStyle = '#2a1a0a';
        ctx.beginPath();
        ctx.arc(250, 45, 4, 0, Math.PI * 2);
        ctx.fill();

        // 漏斗入口
        ctx.strokeStyle = '#2a1a0a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(190, 20);
        ctx.lineTo(230, 55);
        ctx.lineTo(270, 55);
        ctx.lineTo(310, 20);
        ctx.stroke();

        /* ---- 绘制迷宫墙壁 ---- */
        // 侧边界
        ctx.strokeStyle = '#2a1a0a';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        // 左侧边界（与物理墙 20px 对齐）
        ctx.strokeStyle = '#2a1a0a';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(20, 55);
        for (let y = 55; y < 580; y += 20) {
            const t = (y - 55) / 525;
            const wx = 20 + Math.sin(t * Math.PI * 3.2) * 4 + Math.sin(t * 21) * 2;
            ctx.lineTo(wx, y);
        }
        ctx.lineTo(20, 688);
        ctx.stroke();

        // 右侧边界（与物理墙 480px 对齐）
        ctx.beginPath();
        ctx.moveTo(480, 55);
        for (let y = 55; y < 580; y += 20) {
            const t = (y - 55) / 525;
            const wx = 480 + Math.sin(t * Math.PI * 3.2 + 1.2) * 4 + Math.cos(t * 21) * 2;
            ctx.lineTo(wx, y);
        }
        ctx.lineTo(480, 688);
        ctx.stroke();

        /* ---- 绘制挡板 (含可旋转挡板，从 Matter.js 顶点实时取角度) ---- */
        wallBodies.forEach(body => {
            const isBaffle = body.label === 'baffle';
            const isInnerWall = body.label === 'wall' && body.vertices.length >= 4 &&
                !(body.position.x < 30 || body.position.x > 470);
            if (isBaffle || isInnerWall) {
                const v = body.vertices;
                ctx.strokeStyle = '#2a1a0a';
                ctx.lineWidth = isBaffle ? 5 : 4;
                ctx.lineJoin = 'round';
                ctx.fillStyle = isBaffle ? '#fde68a' : '#fef3c7';
                ctx.beginPath();
                ctx.moveTo(v[0].x, v[0].y);
                for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 旋转挡板正中画销钉点
                if (isBaffle) {
                    ctx.fillStyle = '#2a1a0a';
                    ctx.beginPath();
                    ctx.arc(body.position.x, body.position.y, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        });

        // 木钉
        wallBodies.forEach(body => {
            if (body.label === 'peg') {
                const r = body.circleRadius || 6;
                // 外圈粗黑
                ctx.fillStyle = '#2a1a0a';
                ctx.beginPath();
                ctx.arc(body.position.x, body.position.y, r + 2, 0, Math.PI * 2);
                ctx.fill();
                // 内圈彩色
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(body.position.x, body.position.y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        /* ---- 绘制计分洞 ---- */
        const slotTop = 580;
        const slotXs = [20, 112, 204, 296, 388];
        const slotLabels = ['1', '2', '3', '4', '5'];
        const slotColors = ['#dbeafe', '#d1fae5', '#fef3c7', '#fed7aa', '#fef08a'];

        slotLabels.forEach((label, i) => {
            const sx = slotXs[i];
            const sw = i < 4 ? 92 : 92;

            const isScored = currentScoredSlot === (i + 1);
            ctx.fillStyle = isScored ? '#fef08a' : slotColors[i];
            ctx.strokeStyle = '#2a1a0a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(sx + 3, slotTop + 6, sw - 6, 100, 8);
            ctx.fill();
            ctx.stroke();

            // 分数标签
            ctx.fillStyle = label === '5' ? '#dc2626' : '#2a1a0a';
            ctx.font = `bold ${label === '5' ? 22 : 18}px "Ma Shan Zheng","PingFang SC",cursive`;
            ctx.textAlign = 'center';
            ctx.fillText(label + ' 分', sx + sw / 2, slotTop + 62);
        });

        /* ---- 弹珠拖尾（运动模糊） ---- */
        marbleTrail.forEach(t => {
            const color = currentPlayer === PLAYER_A ?
                `rgba(59, 130, 246, ${t.alpha * 0.4})` :
                `rgba(239, 68, 68, ${t.alpha * 0.4})`;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(t.x, t.y, 8 * t.alpha, 0, Math.PI * 2);
            ctx.fill();
        });

        /* ---- 待发射：钟摆箭头左右摆动，玩家抓时机发射 ---- */
        if (!marbleInPlay && gameActive && marblesRemaining[currentPlayer] > 0) {
            // 摆角: 周期 ~2.5s，摆幅 ±35°
            const now = Date.now();
            const pendAngle = Math.sin(now / 400) * (Math.PI / 5.2);
            const pivotX = 250;
            const pivotY = 45;

            // 摆锤颜色
            const pc = currentPlayer === PLAYER_A ? '#3b82f6' : '#ef4444';

            // 摆杆（从枢轴到弹珠位）
            const tipX = pivotX + Math.sin(pendAngle) * 32;
            const tipY = pivotY + Math.cos(pendAngle) * 32;
            ctx.strokeStyle = '#2a1a0a';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(pivotX, pivotY - 2);
            ctx.lineTo(tipX, tipY);
            ctx.stroke();

            // 末端弹珠
            ctx.fillStyle = pc;
            ctx.beginPath();
            ctx.arc(tipX, tipY, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#2a1a0a';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 弹珠高光
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(tipX - 3, tipY - 3, 3, 0, Math.PI * 2);
            ctx.fill();

            // 方向箭头（指示摆动趋势）
            const dir = pendAngle > 0.05 ? '→' : pendAngle < -0.05 ? '←' : '↓';
            ctx.fillStyle = '#2a1a0a';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(dir, tipX, tipY + 20);

            // 存储摆角 + 更新右侧面板箭头
            window.__pendAngle = pendAngle;
            const arrowEl = document.getElementById('pendulumArrow');
            if (arrowEl) {
                arrowEl.textContent = dir;
                arrowEl.style.transform = `rotate(${pendAngle * 1.2}rad)`;
            }
        }

        /* ---- 当前弹珠 ---- */
        if (currentMarble && marbleInPlay) {
            // 添加拖尾记录
            if (Math.random() < 0.7) {
                marbleTrail.push({
                    x: currentMarble.position.x,
                    y: currentMarble.position.y,
                    alpha: 0.7
                });
            }

            const mx = currentMarble.position.x;
            const my = currentMarble.position.y;
            const r = currentMarble.circleRadius || 10;

            // 弹珠主体
            const color = currentPlayer === PLAYER_A ? '#3b82f6' : '#ef4444';
            const lightColor = currentPlayer === PLAYER_A ? '#93c5fd' : '#fca5a5';
            const darkColor = currentPlayer === PLAYER_A ? '#1d4ed8' : '#b91c1c';

            // 外圈黑边
            ctx.fillStyle = '#2a1a0a';
            ctx.beginPath();
            ctx.arc(mx, my, r + 2, 0, Math.PI * 2);
            ctx.fill();

            // 主体色
            const grad = ctx.createRadialGradient(mx - r*0.3, my - r*0.3, r*0.1, mx, my, r);
            grad.addColorStop(0, lightColor);
            grad.addColorStop(0.7, color);
            grad.addColorStop(1, darkColor);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(mx, my, r, 0, Math.PI * 2);
            ctx.fill();

            // 高光点
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(mx - r*0.3, my - r*0.3, r*0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        /* ---- 粒子特效 ---- */
        particles.forEach(p => {
            const alpha = p.life / p.maxLife;
            ctx.fillStyle = `rgba(${hexToRgb(p.color)},${alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fill();
        });

        /* ---- 得分弹出 ---- */
        if (scorePopup) {
            ctx.fillStyle = `rgba(0,0,0,${scorePopup.alpha})`;
            ctx.font = 'bold 24px "Ma Shan Zheng","PingFang SC",cursive';
            ctx.textAlign = 'center';
            ctx.fillText(scorePopup.text, scorePopup.x, scorePopup.y);
        }

        /* ---- 金色全屏闪光 ---- */
        if (goldFlash > 0) {
            ctx.fillStyle = `rgba(255, 215, 0, ${goldFlash * 0.35})`;
            ctx.fillRect(0, 0, WORLD_W, WORLD_H);
        }
    }

    /** 将十六进制颜色转为 RGB 字符串 */
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return `${r},${g},${b}`;
    }

    /* ================================================================
     *  游戏循环
     * ================================================================ */

    let lastTime = 0;
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min(timestamp - lastTime, 33); // 限制最大步长
        lastTime = timestamp;

        if (gameActive || marbleInPlay) {
            Engine.update(engine, dt);
        }

        updateParticles();
        updateEffects();
        render();
        requestAnimationFrame(gameLoop);
    }

    /* ================================================================
     *  输入事件
     * ================================================================ */

    launchBtn.addEventListener('click', () => {
        if (!marbleInPlay && gameActive) {
            launchMarble();
        }
    });

    // 空格键也可以发射
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !marbleInPlay && gameActive) {
            e.preventDefault();
            launchMarble();
        }
    });

    newGameBtn.addEventListener('click', () => {
        resetGame();
    });

    playAgainBtn.addEventListener('click', () => {
        resetGame();
    });

    /* ================================================================
     *  窗口大小调整
     * ================================================================ */

    function resizeCanvas() {
        const rect = mazeSection.getBoundingClientRect();
        const scale = Math.min(rect.width / WORLD_W, rect.height / WORLD_H);
        canvas.style.width = (WORLD_W * scale) + 'px';
        canvas.style.height = (WORLD_H * scale) + 'px';
    }

    window.addEventListener('resize', resizeCanvas);

    /* ================================================================
     *  初始化
     * ================================================================ */

    function init() {
        buildMaze();
        resizeCanvas();
        gameActive = true;
        marbleInPlay = false;
        updateUI();
        requestAnimationFrame(gameLoop);
        console.log('🎱 双人弹珠迷宫对决已就绪！');
        console.log('   点击"发射"按钮或按空格键发射弹珠');
    }

    init();
})();
</script>
